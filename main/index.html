<!DOCTYPE html>
<html>
<head>
    <title>LED Controller</title>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #dfe2e6;
            --fg: #1a1d21;
            --panel: #ffffff;
            --line: #b9bec5;
            --line-soft: #e3e6e9;
            --chip: #eef0f2;
            --head-bg: #00424d;
            --head-fg: #ffffff;
            --head-unit: #9fc5cb;
            --accent: #00a0b4;
            --muted: #5c646d;
            --muted2: #868e96;
            --val: #00424d;
            --active-bg: #e0f2f5;
            --h2-fg: #3b4249;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15181b;
                --fg: #d6d9dd;
                --panel: #1e2227;
                --line: #3a4047;
                --line-soft: #2a2f35;
                --chip: #262b31;
                --head-bg: #00333c;
                --head-fg: #e6edef;
                --head-unit: #7fa7ad;
                --muted: #9aa2ab;
                --muted2: #6c747d;
                --val: #7fd4e0;
                --active-bg: #0d3a42;
                --h2-fg: #b9c1c9;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            max-width: 560px;
            margin: 0 auto;
        }
        /* Header bar */
        header {
            background: var(--head-bg);
            color: var(--head-fg);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 3px solid var(--accent);
        }
        header h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header .unit {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--head-unit);
            text-transform: uppercase;
        }
        /* Status strip */
        #status {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            padding: 10px 18px;
            display: flex;
            gap: 32px;
        }
        .readout .lbl {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            display: block;
        }
        .readout .val {
            font-family: "Courier New", monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--val);
        }
        /* Sections */
        section {
            background: var(--panel);
            border: 1px solid var(--line);
            margin: 14px 14px 0;
        }
        section:last-of-type { margin-bottom: 14px; }
        section > h2 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--h2-fg);
            background: var(--chip);
            border-bottom: 1px solid var(--line);
            padding: 8px 14px;
        }
        .body { padding: 14px; }
        /* Pattern selector: vertical list, industrial toggle rows */
        .patterns button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 0;
            border: 1px solid var(--line);
            border-top: none;
            background: var(--panel);
            font: inherit;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: var(--fg);
            cursor: pointer;
            text-align: left;
        }
        .patterns button:first-child { border-top: 1px solid var(--line); }
        .patterns button .ind {
            width: 42px;
            align-self: stretch;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--chip);
            border-right: 1px solid var(--line);
            color: transparent;
            font-size: 14px;
        }
        .patterns button .txt { padding: 12px 14px; flex: 1; }
        .patterns button .code {
            font-family: "Courier New", monospace;
            font-size: 11px;
            color: var(--muted2);
            padding-right: 14px;
        }
        .patterns button.active { background: var(--active-bg); }
        .patterns button.active .ind {
            background: var(--accent);
            color: #fff;
        }
        .patterns { margin: 14px; }
        /* Controls */
        .ctl { padding: 12px 14px; border-top: 1px solid var(--line-soft); }
        .ctl:first-child { border-top: none; }
        .ctl .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .ctl label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
        }
        .ctl output {
            font-family: "Courier New", monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--val);
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--line);
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            background: var(--panel);
            border: 2px solid var(--val);
            border-radius: 0;
            cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: var(--panel);
            border: 2px solid var(--val);
            border-radius: 0;
            cursor: pointer;
        }
        input[type=color] {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 0;
            padding: 2px;
            background: var(--panel);
            cursor: pointer;
        }
        input[type=color]::-webkit-color-swatch { border: none; border-radius: 0; }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
        .hidden { display: none; }
        footer {
            padding: 10px 18px 18px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted2);
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>LED Controller</h1>
        <span class='unit'>XIAO ESP32-C6 &middot; 3&times;WS2813</span>
    </header>

    <div id='status'>
        <div class='readout'>
            <span class='lbl'>Battery</span>
            <span class='val' id='bat-pct'>--</span>
        </div>
        <div class='readout'>
            <span class='lbl'>Voltage</span>
            <span class='val' id='bat-v'>--</span>
        </div>
        <div class='readout'>
            <span class='lbl'>Mode</span>
            <span class='val' id='mode'>--</span>
        </div>
    </div>

    <div class='patterns'>
        <button data-pattern='off'><span class='ind'>&#9632;</span><span class='txt'>Off</span><span class='code'>P0</span></button>
        <button data-pattern='solid'><span class='ind'>&#9632;</span><span class='txt'>Solid Color</span><span class='code'>P1</span></button>
        <button data-pattern='candle'><span class='ind'>&#9632;</span><span class='txt'>Candle</span><span class='code'>P2</span></button>
        <button data-pattern='lightning'><span class='ind'>&#9632;</span><span class='txt'>Lightning / Storm</span><span class='code'>P3</span></button>
        <button data-pattern='heartbeat'><span class='ind'>&#9632;</span><span class='txt'>Heartbeat</span><span class='code'>P4</span></button>
    </div>

    <section>
        <h2>Output</h2>
        <div class='ctl'>
            <div class='row'>
                <label for='brightness'>Brightness</label>
                <output id='brightness-val'></output>
            </div>
            <input type='range' id='brightness' min='1' max='255'>
        </div>
        <div class='ctl hidden' id='color-ctl'>
            <div class='row'>
                <label for='color'>Color</label>
                <output id='color-val'></output>
            </div>
            <input type='color' id='color'>
        </div>
        <div class='ctl hidden' id='bpm-ctl'>
            <div class='row'>
                <label for='bpm'>Pulse rate</label>
                <output><span id='bpm-val'></span> BPM</output>
            </div>
            <input type='range' id='bpm' min='10' max='180'>
        </div>
    </section>

    <section class='hidden' id='flame-sec'>
        <h2>Flame Character</h2>
        <div class='ctl'>
            <div class='row'>
                <label>LED 1 &middot; Orange</label>
                <output id='orange-val-0'></output>
            </div>
            <input type='range' class='orange' data-i='0' min='0' max='255'>
        </div>
        <div class='ctl'>
            <div class='row'>
                <label>LED 1 &middot; Nervousness</label>
                <output id='nervous-val-0'></output>
            </div>
            <input type='range' class='nervous' data-i='0' min='0' max='255'>
        </div>
        <div class='ctl'>
            <div class='row'>
                <label>LED 2 &middot; Orange</label>
                <output id='orange-val-1'></output>
            </div>
            <input type='range' class='orange' data-i='1' min='0' max='255'>
        </div>
        <div class='ctl'>
            <div class='row'>
                <label>LED 2 &middot; Nervousness</label>
                <output id='nervous-val-1'></output>
            </div>
            <input type='range' class='nervous' data-i='1' min='0' max='255'>
        </div>
        <div class='ctl'>
            <div class='row'>
                <label>LED 3 &middot; Orange</label>
                <output id='orange-val-2'></output>
            </div>
            <input type='range' class='orange' data-i='2' min='0' max='255'>
        </div>
        <div class='ctl'>
            <div class='row'>
                <label>LED 3 &middot; Nervousness</label>
                <output id='nervous-val-2'></output>
            </div>
            <input type='range' class='nervous' data-i='2' min='0' max='255'>
        </div>
    </section>

    <footer>Type 3LC-01 &middot; Rev A</footer>

<script>
let state = { pattern: 'off', brightness: 128, r: 255, g: 40, b: 40, bpm: 60,
              orange: [100, 100, 100], nervous: [40, 120, 200] };
let sendTimer = null;

const modeCodes = { off: 'P0', solid: 'P1', candle: 'P2', lightning: 'P3', heartbeat: 'P4' };

function hex(n) { return n.toString(16).padStart(2, '0'); }

function render() {
    document.querySelectorAll('.patterns button').forEach(b =>
        b.classList.toggle('active', b.dataset.pattern === state.pattern));
    document.getElementById('mode').textContent = modeCodes[state.pattern] || '--';
    document.getElementById('brightness').value = state.brightness;
    document.getElementById('brightness-val').textContent =
        Math.round(state.brightness / 255 * 100) + ' %';
    const c = '#' + hex(state.r) + hex(state.g) + hex(state.b);
    document.getElementById('color').value = c;
    document.getElementById('color-val').textContent = c.toUpperCase();
    document.getElementById('bpm').value = state.bpm;
    document.getElementById('bpm-val').textContent = state.bpm;
    document.querySelectorAll('.orange').forEach(sl => {
        const i = +sl.dataset.i;
        sl.value = state.orange[i];
        document.getElementById('orange-val-' + i).textContent =
            Math.round(state.orange[i] / 255 * 100) + ' %';
    });
    document.querySelectorAll('.nervous').forEach(sl => {
        const i = +sl.dataset.i;
        sl.value = state.nervous[i];
        document.getElementById('nervous-val-' + i).textContent =
            Math.round(state.nervous[i] / 255 * 100) + ' %';
    });
    document.getElementById('color-ctl').classList.toggle('hidden',
        state.pattern !== 'solid' && state.pattern !== 'heartbeat');
    document.getElementById('bpm-ctl').classList.toggle('hidden',
        state.pattern !== 'heartbeat');
    document.getElementById('flame-sec').classList.toggle('hidden',
        state.pattern !== 'candle');
}

function send() {
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => {
        fetch('/api/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state)
        }).catch(() => {});
    }, 80);
}

document.querySelectorAll('.patterns button').forEach(b =>
    b.addEventListener('click', () => {
        state.pattern = b.dataset.pattern;
        render(); send();
    }));

document.getElementById('brightness').addEventListener('input', e => {
    state.brightness = +e.target.value;
    render(); send();
});

document.getElementById('color').addEventListener('input', e => {
    state.r = parseInt(e.target.value.substr(1, 2), 16);
    state.g = parseInt(e.target.value.substr(3, 2), 16);
    state.b = parseInt(e.target.value.substr(5, 2), 16);
    render(); send();
});

document.getElementById('bpm').addEventListener('input', e => {
    state.bpm = +e.target.value;
    render(); send();
});

document.querySelectorAll('.orange').forEach(sl =>
    sl.addEventListener('input', e => {
        state.orange[+e.target.dataset.i] = +e.target.value;
        render(); send();
    }));

document.querySelectorAll('.nervous').forEach(sl =>
    sl.addEventListener('input', e => {
        state.nervous[+e.target.dataset.i] = +e.target.value;
        render(); send();
    }));

function refreshBattery(s) {
    if (s.battery_v !== undefined) {
        document.getElementById('bat-pct').textContent = s.battery_pct.toFixed(0) + ' %';
        document.getElementById('bat-v').textContent = s.battery_v.toFixed(2) + ' V';
    }
}

fetch('/api/state').then(r => r.json()).then(s => {
    state = { pattern: s.pattern, brightness: s.brightness, r: s.r, g: s.g, b: s.b,
              bpm: s.bpm, orange: s.orange || [100, 100, 100],
              nervous: s.nervous || [40, 120, 200] };
    refreshBattery(s);
    render();
});

setInterval(() => {
    fetch('/api/state').then(r => r.json()).then(refreshBattery).catch(() => {});
}, 30000);
</script>
</body>
</html>
